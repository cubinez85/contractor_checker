{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <h1 class="text-center mb-4">Проверка контрагентов через ФНС</h1>
        
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email для отчета</label>
                        <input type="email" class="form-control" id="email" name="email" required
                               value="cubinez85@cubinez.ru">
                    </div>
                    
                    <div class="mb-3">
                        <label for="inn_list" class="form-label">Список ИНН (каждый с новой строки или через запятую)</label>
                        <textarea class="form-control" id="inn_list" name="inn_list" rows="10" required
                                  placeholder="7707083893
7710140679
7702070139"></textarea>
                        <small class="text-muted">Максимум 100 ИНН за раз</small>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Проверить</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
