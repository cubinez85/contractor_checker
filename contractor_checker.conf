server {
    listen 80;
    server_name checker.cubinez.ru;

    access_log /var/www/contractor_checker/logs/nginx_access.log;
    error_log /var/www/contractor_checker/logs/nginx_error.log;

    # Базовая аутентификация для всего сайта
    auth_basic "Contractor Checker - Restricted Area";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /static {
        alias /var/www/contractor_checker/app/static;
    }

    # Папка с отчетами - доступ ТОЛЬКО через Flask (internal)
    location /reports {
        alias /var/www/contractor_checker/reports;
        internal;  # Прямой доступ извне запрещен, только через внутренние редиректы
    }

    # Маршрут для скачивания через Flask не требует отдельного location,
    # так как он проксируется на Gunicorn через location /

    client_max_body_size 10M;
}
